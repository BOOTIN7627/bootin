<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOOTIN</title><meta name="theme-color" content="#F6C915"><link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" href="icon4-192.png"><link rel="apple-touch-icon" href="icon4-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BOOTIN">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style></head><body><style>/* 配置：上に日付と時計の大きな札、真ん中に3×3の入口、右下に「さっとメモ」。黄色と黒の手帳 */
:root{
  --paper:#FBF8EE; --card:#FFFFFF; --ink:#1E1B14; --sub:#6B6450; --line:#E6DFC8; --soft:#F3EEDC;
  --bee:#F6C915; --beeInk:#1E1B14; --accent:#2D6CDF; --ok:#2E8B57; --warn:#C0392B;
  --hol:#D32F2F; --sun:#D32F2F; --sat:#1565E8;
  --shadow:0 2px 0 rgba(30,27,20,.10);
  --f-disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --fs:17px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17150F; --card:#221F17; --ink:#F3EEDD; --sub:#B3AA90; --line:#3A3527; --soft:#2B271D;
  --accent:#7FA8F5; --ok:#5BC48A; --warn:#F07B6E; --hol:#FF6B6B; --sun:#FF6B6B; --sat:#8FB4FF;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17150F; --card:#221F17; --ink:#F3EEDD; --sub:#B3AA90; --line:#3A3527; --soft:#2B271D;
  --accent:#7FA8F5; --ok:#5BC48A; --warn:#F07B6E; --hol:#FF6B6B; --sun:#FF6B6B; --sat:#8FB4FF;
  --shadow:none; color-scheme:dark}
:root[data-kise="sakura"]{--bee:#F4A7B9}
:root[data-kise="sora"]{--bee:#8CCBF0}
:root[data-kise="wakaba"]{--bee:#A8D672}
:root[data-kise="aka"]{--bee:#D93A2B;--beeInk:#FFFFFF}
:root[data-kise="ao"]{--bee:#2D62C8;--beeInk:#FFFFFF}
:root[data-kise="kuro"]{--bee:#1E1B14;--beeInk:#FFFFFF}
:root[data-kise="midori"]{--bee:#2E8B4F;--beeInk:#FFFFFF}
:root[data-kise="orange"]{--bee:#F08A00;--beeInk:#1E1B14}
:root[data-kise="murasaki"]{--bee:#6B4FC8;--beeInk:#FFFFFF}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
html.f2{--fs:19px} html.f3{--fs:22px}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6;margin:0}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 130px}

/* 見出しの帯 */
.hd{display:flex;align-items:center;gap:8px;padding-block:4px 10px}
.hd .grow{flex:1;min-width:0}
.hd h1{font-family:var(--f-disp);font-weight:900;font-size:1.35rem;margin:0;line-height:1.25;text-wrap:balance}
.hd .brand{display:flex;align-items:center;gap:6px;font-family:var(--f-disp);font-weight:900;font-size:1.3rem;letter-spacing:.04em}
.hd .brand img{width:34px;height:auto}
.ib{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:6px 10px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;min-height:44px}
.ib.help{background:var(--warn);color:#fff;border-color:var(--warn)}
.ib.ghost{border-color:var(--line)}

/* 日付と時計の札 */
.clock{background:var(--bee);color:var(--beeInk);border:2px solid var(--ink);border-radius:20px;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end;width:100%;text-align:left;box-shadow:var(--shadow)}
.clock .d{font-family:var(--f-disp);font-weight:900;font-size:1.2rem;line-height:1.3}
.clock .k{font-size:.85rem;font-weight:700;opacity:.85}
.clock .t{font-family:var(--f-disp);font-weight:900;font-size:2.8rem;line-height:1;font-variant-numeric:tabular-nums;grid-row:1 / span 2;grid-column:2}
.wx{display:flex;gap:8px;align-items:center;margin-top:8px}
.wxb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px;text-align:left}
.wxb .big{font-size:1.6rem;line-height:1}
.wxb b{font-size:1.1rem}
.wxb span{color:var(--sub);font-size:.85rem}

.otayori{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 12px;margin-top:8px}
.otayori img{width:38px;flex:none}
.otayori .t{min-width:0;flex:1}
.otayori small{display:block;color:var(--sub);font-size:.75rem;font-weight:700}
.otayori b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sec{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
.sec>h2,.sec>h3{font-family:var(--f-disp);font-size:1.05rem;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.sec>h2 .more,.sec>h3 .more{margin-left:auto;font-size:.85rem;font-family:var(--f-body);color:var(--accent);background:none;border:0;font-weight:700}
.muted{color:var(--sub)}
.small{font-size:.85rem}

/* 3×3 の入口 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.grid.big{grid-template-columns:repeat(2,1fr)}
.cell{position:relative;aspect-ratio:1/1;max-width:100%;border:2px solid var(--ink);background:var(--card);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;font-weight:700;box-shadow:var(--shadow);min-width:0}
.cell .em{font-size:2rem;line-height:1}
.grid.big .cell .em{font-size:2.6rem}
.cell .nm{font-size:.88rem;line-height:1.25;overflow-wrap:anywhere}
.grid.big .cell .nm{font-size:1.1rem}
.cell .lv{position:absolute;top:6px;left:6px;width:10px;height:10px;border-radius:3px}
.cell.empty{border-style:dashed;border-color:var(--line);color:var(--sub);box-shadow:none}
.cell.red{background:var(--card)}
.lv.r{background:#E0452B}.lv.b{background:#3B82D6}.lv.y{background:#F0B400}.lv.g{background:#2E9B4F}
.editbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.cell .ctl{position:absolute;inset:auto 4px 4px 4px;display:flex;justify-content:space-between}
.cell .ctl button{border:2px solid var(--ink);background:var(--bee);color:var(--beeInk);border-radius:8px;min-width:30px;min-height:30px;font-weight:900;padding:0 4px}

/* 一覧の行 */
.list{display:grid;gap:8px;margin-top:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%;box-shadow:var(--shadow);min-height:56px}
.row .t{min-width:0;flex:1}
.row b{font-size:1.08rem;display:block;overflow-wrap:anywhere}
.row span{color:var(--sub);font-size:.88rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .go{font-size:1.3rem;color:var(--sub);flex:none}
.row .em{font-size:1.6rem;flex:none;width:2rem;text-align:center}
.badge{display:inline-block;font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap;vertical-align:middle}
.badge.ok{background:var(--ok);color:#fff}
.badge.wait{background:var(--soft);color:var(--sub);border:1.5px solid var(--line)}
.badge.off{background:var(--line);color:var(--sub)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}

.search{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:1rem}
.btn{border:2px solid var(--ink);background:var(--bee);color:var(--beeInk);border-radius:14px;padding:10px 16px;font-weight:900;font-family:var(--f-disp);min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.w{width:100%}
.btn.plain{background:var(--card);color:var(--ink)}
.btn.danger{background:var(--card);color:var(--warn);border-color:var(--warn)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns>*{flex:1 1 auto}

/* 地図・電話の小さなボタン */
.mini{display:inline-flex;align-items:center;gap:3px;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:3px 9px;font-weight:700;font-size:.85rem;text-decoration:none;min-height:34px;white-space:nowrap}
.mini.map{border-color:#2E8B57;color:#2E8B57}
.mini.navi{background:#2E8B57;border-color:#2E8B57;color:#fff}
.mini.tel{border-color:var(--accent);color:var(--accent)}
.minis{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* 入力 */
.f{display:grid;gap:4px;margin-top:10px}
.f>label,.f>.lb{font-weight:700;font-size:.9rem}
.f input:not([type=checkbox]):not([type=radio]),.f select,.f textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);min-height:46px}
.f textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two>*{min-width:0}
.ck{display:flex;gap:8px;align-items:center;padding:6px 0}
.ck input{width:22px;height:22px}
.choose{display:flex;gap:6px;flex-wrap:wrap}
.choose label{border:2px solid var(--line);border-radius:999px;padding:5px 12px;display:inline-flex;gap:6px;align-items:center;font-weight:700;background:var(--card)}
.choose input{position:absolute;opacity:0;pointer-events:none}
.choose label:has(input:checked){border-color:var(--ink);background:var(--bee);color:var(--beeInk)}

/* 1日カード */
.dayhd{display:flex;align-items:center;gap:8px}
.dayhd .arrow{border:2px solid var(--ink);background:var(--card);border-radius:12px;min-width:46px;min-height:46px;font-weight:900;font-size:1.2rem}
.dayhd .c{flex:1;text-align:center;min-width:0}
.dayhd .c b{font-family:var(--f-disp);font-size:1.4rem;display:block;line-height:1.3}
.koyomi{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.kk{font-size:.82rem;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:1px 8px}
.kk.hol{border-color:var(--hol);color:var(--hol);font-weight:700}
.kk.cn{border-color:#B23A3A;color:#B23A3A}
.ev{display:flex;gap:10px;background:var(--card);border:2px solid var(--line);border-left-width:8px;border-radius:12px;padding:8px 10px;width:100%;text-align:left}
.ev .tm{flex:none;width:3.6rem;font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem}
.ev .bd{min-width:0;flex:1}
.ev .bd b{display:block;font-size:1.05rem;overflow-wrap:anywhere}
.ev .bd span{display:block;color:var(--sub);font-size:.88rem;overflow-wrap:anywhere}
.evs{display:grid;gap:8px;margin-top:8px}

/* 月のカレンダー */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:8px}
.cal .wd{text-align:center;font-size:.8rem;font-weight:700;padding:2px 0}
.cal .dy{background:var(--card);border:1.5px solid var(--line);border-radius:8px;min-height:74px;padding:2px 3px;text-align:left;display:flex;flex-direction:column;gap:1px;overflow:hidden;min-width:0}
.cal .dy.out{opacity:.4}
.cal .dy.today{border:2.5px solid var(--ink);background:var(--soft)}
.cal .n{font-weight:900;font-size:.95rem;line-height:1.2;font-variant-numeric:tabular-nums}
.cal .hn{font-size:.58rem;color:var(--hol);line-height:1.1;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal .e{font-size:.62rem;line-height:1.25;border-radius:3px;padding:0 2px;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal .mo{font-size:.6rem;color:var(--sub);font-weight:700}
.c-sun{color:var(--sun)}.c-sat{color:var(--sat)}.c-hol{color:var(--hol)}
/* 祝日は日の丸のように、数字の後ろにうすい赤の丸 */
.cal .n.c-hol{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;min-width:1.75em;height:1.75em;padding:0 .2em;border-radius:999px;background:rgba(229,57,53,.2)}

/* 人・施設のカード */
.face{flex:none;border-radius:50%;overflow:hidden;background:var(--soft);display:block;border:2px solid var(--line)}
.face img,.face svg{display:block;width:100%;height:100%;object-fit:cover}
.hero{display:flex;gap:14px;align-items:center;margin-top:4px}
.hero h2{font-family:var(--f-disp);font-size:1.55rem;margin:0;line-height:1.25;overflow-wrap:anywhere}
.hero .kana{color:var(--sub);font-size:.85rem}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:.8rem;border:1.5px solid var(--sub);color:var(--sub);border-radius:6px;padding:0 8px;display:inline-flex;align-items:center;gap:4px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.act{border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 4px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:0;text-decoration:none;min-width:0;text-align:center}
.act .em{font-size:1.4rem;line-height:1.3}
.act small{font-weight:400;color:var(--sub);font-size:.7rem;overflow-wrap:anywhere}
.act[aria-disabled="true"]{opacity:.35;pointer-events:none}
.kv{display:grid;grid-template-columns:6.5em 1fr;gap:4px 10px;margin:0}
.kv dt{color:var(--sub);font-size:.88rem}
.kv dd{margin:0;overflow-wrap:anywhere}
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.log li{border-left:4px solid var(--bee);padding-left:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.log time{font-size:.8rem;color:var(--sub);font-variant-numeric:tabular-nums;display:block}
.stars{font-size:1.15rem;letter-spacing:.04em;white-space:nowrap}
.stars .ten{color:#D32F2F}

/* 準備中 */
.junbi{text-align:center;padding:18px 10px}
.junbi img{width:120px}
.junbi .stamp{display:inline-block;font-family:var(--f-disp);font-weight:900;font-size:1.5rem;border:3px solid var(--warn);color:var(--warn);border-radius:10px;padding:2px 14px;transform:rotate(-4deg);margin:8px 0}
.plan{list-style:none;padding:0;margin:0;display:grid;gap:6px;text-align:left}
.plan li{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;gap:8px;align-items:flex-start}
.plan li span{flex:1;min-width:0}
.when{flex:none;font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 6px;margin-top:3px}
.when.s{background:var(--bee);color:var(--beeInk)}
.when.p{background:var(--soft);color:var(--sub);border:1px solid var(--line)}

/* ふきだし */
.say{display:flex;gap:10px;align-items:flex-end;margin-top:8px}
.say img{width:56px;flex:none}
.say .b{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:8px 12px;font-family:var(--f-disp);font-weight:700;flex:1;min-width:0}

/* 右下の「さっとメモ」 */
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;border:2px solid var(--ink);background:var(--bee);color:var(--beeInk);border-radius:999px;padding:10px 18px;font-family:var(--f-disp);font-weight:900;font-size:1.05rem;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;gap:6px;min-height:52px}

/* 下から出る窓 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:620px;border-radius:20px 20px 0 0;border:2px solid var(--ink);border-bottom:0;max-height:88vh;overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{font-family:var(--f-disp);margin:0 0 8px;font-size:1.25rem;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto}
.bigbtn{display:flex;align-items:center;gap:12px;width:100%;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:16px;padding:12px 14px;font-weight:900;font-size:1.1rem;text-align:left;text-decoration:none;min-height:64px}
.bigbtn .em{font-size:1.8rem}
.bigbtn small{display:block;font-weight:400;font-size:.8rem;color:var(--sub)}
.bigbtn.red{border-color:var(--warn)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:40;max-width:90vw;text-align:center}

/* 機能のオンオフ */
details.tree{background:var(--card);border:2px solid var(--line);border-radius:14px;margin-top:8px}
details.tree>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:900;cursor:pointer}
details.tree>summary::-webkit-details-marker{display:none}
.tw{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1.5px solid var(--line)}
.tw .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.tw.b{padding-left:22px;font-weight:700}
.tw.y{padding-left:40px;font-size:.92rem}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{left:25px}
.sw input:disabled+i{opacity:.5}
.lock{font-size:.75rem;color:var(--sub);white-space:nowrap}

.tool-t{font-family:var(--f-disp);font-weight:900;font-size:3.2rem;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.calc button{min-height:54px;border:2px solid var(--line);background:var(--card);border-radius:12px;font-size:1.3rem;font-weight:700}
.calc button.op{background:var(--soft)}
.calc button.eq{background:var(--bee);color:var(--beeInk);border-color:var(--ink)}
.calc-d{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:8px 12px;text-align:right;font-size:2rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-height:3.2rem}
.wxday{display:grid;grid-template-columns:4.5em 2em 1fr auto;gap:6px;align-items:center;padding:6px 0;border-top:1.5px solid var(--line)}
.hours{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.hours>div{flex:none;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;min-width:58px}
.mecard{border:3px solid var(--warn);border-radius:16px;padding:12px 14px;background:var(--card)}
.mecard h3{margin:0 0 6px;color:var(--warn);font-family:var(--f-disp)}
.empty{text-align:center;color:var(--sub);padding:18px 8px}
.empty img{width:80px;display:block;margin:0 auto 6px}
.src{font-size:.72rem;font-weight:700;background:var(--soft);border:1px solid var(--line);color:var(--sub);border-radius:6px;padding:0 6px;margin-right:6px}
.memoimg{max-width:100%;border-radius:10px;margin-top:6px;display:block}
.photo-pick{display:flex;align-items:center;gap:12px}

/* パソコンの広い画面：入口を左に並べ、トップはカレンダーを右に */
.side{display:none}
.pc-only{display:none}
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto;border-right:2px solid var(--line);background:var(--card);padding:14px 10px 24px}
  .side .brand{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:900;font-size:1.4rem;padding:0 6px 10px}
  .side .brand img{width:40px}
  .sn{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:10px;font-weight:700;width:100%}
  .sn span{width:1.6em;text-align:center}
  .sn:hover{background:var(--soft)}
  .sn.on{background:var(--bee);color:var(--beeInk)}
  .sn-h{font-size:.75rem;color:var(--sub);font-weight:700;letter-spacing:.1em;padding:12px 10px 2px}
  .wrap{max-width:1040px;padding-block:18px 110px}
  .wrap.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:0 22px;align-items:start}
  .wrap.home .hd .brand{visibility:hidden}
  .hcol2 .grid{margin-top:0}
  .pc-only{display:block}
  .cal .dy{min-height:96px}
  .hcol2 .cal .dy{min-height:58px}
  .cal .e{font-size:.7rem}
}
.list>*,.evs>*{min-width:0;max-width:100%}
.wxb .t{display:flex;flex-direction:column;color:var(--ink);font-size:1rem;min-width:0}
.wxb .t span{display:block}
@media (min-width:960px){ .mobile-only{display:none} .wrap.home{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)} .hcol2>.sec:first-child{margin-top:0} .hcol1 .grid{margin-top:12px} }
.plan li .when{flex:none}
a.row{text-decoration:none;color:inherit}
html.f3 .hd .brand span{display:none}
.tsel{display:flex;gap:6px;align-items:center}.tsel select{flex:1;min-width:0;padding:10px 8px;border:2px solid var(--line);border-radius:12px;background:var(--card);min-height:46px}
.cal .dy.nx{background:var(--soft)}.cal .dy.past{opacity:.45}

/* 下の「もどる」帯（トップ以外の画面） */
.botnav{position:fixed;left:0;bottom:0;z-index:19;display:flex;gap:8px;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.botnav button{pointer-events:auto;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:900;font-family:var(--f-disp);min-height:52px;box-shadow:0 3px 0 var(--ink)}
.wrap>.hd:first-child{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--paper);margin-inline:-4px;padding-inline:4px}
@media (min-width:960px){.botnav{left:232px}}

/* 下の移動帯：もどる・トップ・1日カード・カレンダー・人物帳・メモ */
.botnav{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:19;display:flex;background:var(--card);border-top:2px solid var(--ink);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabbar button{flex:1 1 0;min-width:0;border:0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 0;font-weight:700;font-size:.72rem;border-radius:10px;min-height:54px;white-space:nowrap}
.tabbar button span{font-size:1.35rem;line-height:1.2}
.tabbar button[data-act="back"]{background:var(--ink);color:var(--paper);margin-right:4px}
.tabbar button[aria-current="page"]{background:var(--bee);color:var(--beeInk)}
.fab{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.wrap{padding-block-end:150px}
.toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
@media (min-width:960px){.tabbar{left:232px}.tabbar button{font-size:.85rem}}

.calnav{display:flex;align-items:center;gap:6px;margin:6px 0 8px}
.calnav .btn{flex:none;min-height:46px;padding:6px 10px;font-size:.95rem;white-space:nowrap}
.calnav .c{flex:1;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.calnav .c b{font-size:1.05rem;line-height:1.2}
.calnav .todayb{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:700}
[data-swipe]{touch-action:pan-y}

.gbox{border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin:0 0 8px;background:var(--card)}
.gbig{font-weight:900;margin:0 0 4px}
.gsub{font-size:.85rem;color:var(--muted,#7A7363);font-weight:700;margin:6px 0 3px}
.gbox .choose label{padding:4px 10px}

.topbtn{display:inline-flex;align-items:center;justify-content:center;background:#111;color:#fff;border:0;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1rem;letter-spacing:.04em;white-space:nowrap;line-height:1.1;min-height:40px}
.hd .topbtn{flex:none}
.tabbar button.tb-top{justify-content:center}
.tabbar button.tb-top .topbtn{font-size:.85rem;padding:9px 10px;min-height:0;line-height:1.1}
.tabbar button.tb-top[aria-current="page"]{background:none}
.sn.topsn{justify-content:flex-start}

/* トップの枠のごく薄い色（隣同士で同じ色にならない並び） */
:root{--t-wx:#EEF7FC;--t-ot:#FDF0F3;--t-fav:#FEF3E6;--t-med:#F4F0FB;--t-today:#EEF7EE;--t-cal:#FFFBE3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--t-wx:#1D2A31;--t-ot:#30222A;--t-fav:#32291D;--t-med:#27223A;--t-today:#1E2D22;--t-cal:#2E2A18}}
:root[data-theme="dark"]{--t-wx:#1D2A31;--t-ot:#30222A;--t-fav:#32291D;--t-med:#27223A;--t-today:#1E2D22;--t-cal:#2E2A18}
.wxb{background:var(--t-wx)}
.otayori{background:var(--t-ot)}
.sec.t-fav{background:var(--t-fav)}
.sec.t-med{background:var(--t-med)}
.sec.t-today{background:var(--t-today)}
.sec.t-cal{background:var(--t-cal)}

@media (prefers-color-scheme: dark){:root[data-kise="kuro"]:not([data-theme="light"]){--bee:#000000;--beeInk:#FFFFFF}}
:root[data-theme="dark"][data-kise="kuro"]{--bee:#000000}
.kise label .sw{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);display:inline-block}

/* 柄のある着せかえ（日付と時計の枠に柄。文字が読めるよう柄は薄め） */

:root[data-kise="yuki"]{--bee:#2C3E63;--beeInk:#FFFFFF;--beePat:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2760%27 height=%2760%27%3E%3Cg fill=%27%23FFFFFF%27 opacity=%27.5%27%3E%3Ccircle cx=%278%27 cy=%2710%27 r=%273%27/%3E%3Ccircle cx=%2738%27 cy=%276%27 r=%272%27/%3E%3Ccircle cx=%2726%27 cy=%2730%27 r=%274%27/%3E%3Ccircle cx=%2752%27 cy=%2734%27 r=%272.5%27/%3E%3Ccircle cx=%2712%27 cy=%2748%27 r=%272%27/%3E%3Ccircle cx=%2744%27 cy=%2754%27 r=%273%27/%3E%3C/g%3E%3C/svg%3E")}
:root[data-kise="haru"]{--bee:#F3B6C4;--beeInk:#1E1B14;--beePat:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2760%27 height=%2760%27%3E%3Cg fill=%27%23FFFFFF%27 opacity=%27.7%27%3E%3Cellipse cx=%2712%27 cy=%2714%27 rx=%275%27 ry=%273%27 transform=%27rotate%2830 12 14%29%27/%3E%3Cellipse cx=%2742%27 cy=%2710%27 rx=%274%27 ry=%272.5%27 transform=%27rotate%28-20 42 10%29%27/%3E%3Cellipse cx=%2730%27 cy=%2736%27 rx=%275%27 ry=%273%27 transform=%27rotate%2870 30 36%29%27/%3E%3Cellipse cx=%2752%27 cy=%2748%27 rx=%274%27 ry=%272.5%27 transform=%27rotate%2810 52 48%29%27/%3E%3Cellipse cx=%2710%27 cy=%2750%27 rx=%274%27 ry=%272.5%27 transform=%27rotate%28-50 10 50%29%27/%3E%3C/g%3E%3C/svg%3E")}
:root[data-kise="natsu"]{--bee:#2E86B8;--beeInk:#FFFFFF;--beePat:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2748%27 height=%2724%27%3E%3Cpath d=%27M0 12 Q12 2 24 12 T48 12%27 fill=%27none%27 stroke=%27%23FFFFFF%27 stroke-width=%272%27 opacity=%27.35%27/%3E%3Cpath d=%27M0 22 Q12 14 24 22 T48 22%27 fill=%27none%27 stroke=%27%23BFE6F7%27 stroke-width=%272%27 opacity=%27.35%27/%3E%3C/svg%3E")}
:root[data-kise="seigaiha"]{--bee:#27405F;--beeInk:#FFFFFF;--beePat:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2740%27 height=%2720%27%3E%3Cg fill=%27%2327405F%27 stroke=%27%23FFFFFF%27 stroke-opacity=%27.3%27 stroke-width=%271.5%27%3E%3Ccircle cx=%2720%27 cy=%270%27 r=%2719%27/%3E%3Ccircle cx=%2720%27 cy=%270%27 r=%2713%27/%3E%3Ccircle cx=%2720%27 cy=%270%27 r=%277%27/%3E%3Ccircle cx=%270%27 cy=%2710%27 r=%2719%27/%3E%3Ccircle cx=%270%27 cy=%2710%27 r=%2713%27/%3E%3Ccircle cx=%270%27 cy=%2710%27 r=%277%27/%3E%3Ccircle cx=%2740%27 cy=%2710%27 r=%2719%27/%3E%3Ccircle cx=%2740%27 cy=%2710%27 r=%2713%27/%3E%3Ccircle cx=%2740%27 cy=%2710%27 r=%277%27/%3E%3Ccircle cx=%2720%27 cy=%2720%27 r=%2719%27/%3E%3Ccircle cx=%2720%27 cy=%2720%27 r=%2713%27/%3E%3Ccircle cx=%2720%27 cy=%2720%27 r=%277%27/%3E%3C/g%3E%3C/svg%3E")}
:root[data-kise="ichimatsu"]{--bee:#4A5E45;--beeInk:#FFFFFF;--beePat:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2732%27 height=%2732%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%23FFFFFF%27 opacity=%27.12%27/%3E%3Crect x=%2716%27 y=%2716%27 width=%2716%27 height=%2716%27 fill=%27%23FFFFFF%27 opacity=%27.12%27/%3E%3C/svg%3E")}
.clock{background-image:var(--beePat,none);background-repeat:repeat}
.kise label .sw.pat{background-size:12px 12px}

.plarea{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.plarea select{flex:1 1 180px;min-width:0;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-weight:700}
.plarea .btn{flex:1 1 160px;min-height:44px;padding:6px 10px}
.linkb{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;font-weight:700}
.row .km{color:var(--accent)}
.plarea .btn{white-space:nowrap;font-size:.92rem}

/* トップの入口：上辺に色のライン（設定で色を変える） */
:root{--gline:#E0452B}
:root[data-gline="bee"]{--gline:var(--bee)}:root[data-gline="ink"]{--gline:var(--ink)}:root[data-gline="b"]{--gline:#3B82D6}:root[data-gline="g"]{--gline:#2E9B4F}
:root[data-gline="rb"]{--gline:linear-gradient(90deg,#E0452B,#F08A00,#D9B300,#2E9B4F,#2D6CDF,#B94FC8)}
.grid .cell:not(.empty){overflow:hidden}
.grid .cell:not(.empty)::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:var(--gline)}
:root[data-gline="none"] .grid .cell::before{display:none}
.ev .unk{font-size:.8rem;line-height:1.2;color:var(--warn);font-weight:900}

/* トップの入口：時計のすぐ下に小さめの3×3 */
.grid.compact{gap:8px;margin-top:10px}
.grid.compact .cell,.grid.menu .cell{aspect-ratio:auto;min-height:72px;border-radius:14px;padding:10px 4px 6px;gap:3px}
.grid.compact .cell .em,.grid.menu .cell .em{font-size:1.6rem}
.grid.compact .cell .nm,.grid.menu .cell .nm{font-size:.82rem;line-height:1.2}
.grid.compact .cell::before{height:6px}
.grid.menu{margin-top:4px}
.grid.menu .cell{min-height:92px}
.grid.menu .cell .em{font-size:2rem}
.grid.menu .cell .nm{font-size:.92rem}
.tabbar button.tb-menu .mn{display:inline-flex;align-items:center;justify-content:center;background:var(--bee);color:var(--beeInk);border:2px solid var(--ink);border-radius:8px;width:30px;height:24px;font-size:1rem;line-height:1;margin-bottom:2px}
.tabbar button.tb-menu{font-weight:900}

button.brand{border:0;background:none;color:inherit;padding:0;text-align:left;cursor:pointer}

/* トップ：9つの入口（正方形3×3）＋右に青枠の3つ（丸） */
.topnav{display:grid;grid-template-columns:3fr 1fr;gap:8px;margin-top:10px;align-items:start}
.topnav .grid.compact.sq{margin-top:0;gap:6px}
.grid.compact.sq .cell{aspect-ratio:1/1;min-height:0;padding:8px 2px 4px;border-radius:12px}
.grid.compact.sq .cell .em{font-size:1.5rem}
.grid.compact.sq .cell .nm{font-size:.72rem;line-height:1.15}
.quick{display:grid;grid-template-rows:repeat(3,1fr);gap:6px;height:100%}
.qb{border:0;border-radius:50%;aspect-ratio:1/1;width:100%;align-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-weight:900;font-size:.68rem;line-height:1.1;box-shadow:0 3px 0 rgba(0,0,0,.35);padding:4px;text-align:center}
.qb .em{font-size:1.35rem;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.q-cal{background:#2D62C8}.q-day{background:#D93A2B}.q-photo{background:#2E8B4F}
/* 天気とお便りを横に並べてスクロールを短く */
.wxrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.wxrow .wx,.wxrow .otayori{margin-top:0}
.wxrow .wxb{height:100%;padding:8px 10px}
.wxrow .otayori{padding:6px 8px;gap:6px}
.wxrow .otayori img{width:30px}
.wxrow .otayori b{font-size:.85rem;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wxrow .wxb .t span{font-size:.75rem}

/* 丸い3つの上下を9つの入口にそろえる */
.topnav{align-items:stretch}
.quick{grid-template-rows:repeat(3,minmax(0,1fr));height:auto;min-height:0}
.qb{width:auto;height:100%;max-width:100%;min-height:0;justify-self:center;overflow:hidden}
.wxrow .otayori small{white-space:nowrap}
/* トップの天気枠の「時間ごとの天気」ボタンと、1時間ごとの一覧 */
.wxrow .wx{flex-direction:column;align-items:stretch;gap:5px}
.wxrow .wxb{height:auto;flex:1}
.wxh{background:#2D62C8;color:#fff;border:0;border-radius:999px;padding:5px 8px;font-weight:900;font-size:.8rem;white-space:nowrap}
.hlist{display:grid;gap:2px}
.hday{font-weight:900;margin:8px 0 2px;padding:3px 8px;background:var(--t-wx,#EAF5FD);border-radius:8px}
.hrow{display:grid;grid-template-columns:2.6em 1.7em 4.6em 2.8em minmax(0,1fr) 2.6em;align-items:center;gap:4px;padding:5px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.hrow.now{background:var(--soft);border-radius:8px;font-weight:700}
.hrow .hh{font-weight:900}
.hrow .hi{font-size:1.3rem}
.hrow .hw{font-size:.75rem;line-height:1.15;overflow:hidden}
.hrow .ht{font-size:.85rem;color:var(--sub)}
.hrow .hp{display:flex;flex-direction:column;line-height:1.1}
.hrow .hp b{font-size:1.15rem;font-weight:900}
.hrow .hp.wet{color:#1565E8;font-weight:900}
.hrow .hp small{font-size:.72rem;color:var(--sub)}
.hrow .hv{font-size:.8rem;color:var(--sub)}
/* 洗濯物のお知らせ（雨が降りそうなとき） */
.laundry{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;background:#E3F0FF;border:2.5px solid #1565E8;border-radius:14px;padding:8px 12px;text-align:left;color:var(--ink);animation:lBlink 1.6s ease-in-out 3}
.laundry .em{font-size:1.5rem;white-space:nowrap}
.laundry .t{display:flex;flex-direction:column;flex:1;min-width:0}
.laundry b{color:#0D47A1;font-size:1.05rem}
.laundry .t span{font-size:.85rem;color:var(--sub)}
.wet15{border-color:#1565E8!important;background:#E3F0FF!important}
@keyframes lBlink{50%{box-shadow:0 0 0 5px rgba(21,101,232,.25)}}
.laundry.rain{background:#FFE5E2;border-color:#D32F2F;animation:lBlinkR 1.2s ease-in-out 4}
.laundry.rain b{color:#B71C1C;font-size:1.15rem}
.laundry.sun{background:#FFF0DC;border-color:#E07A00;animation:none}
.laundry.sun b{color:#A04F00}
@keyframes lBlinkR{50%{box-shadow:0 0 0 6px rgba(211,47,47,.3)}}
/* 天気の「最新情報に更新」ボタン：濃く大きく */
.wxrl{background:#1E1B14;color:#fff;border-color:#1E1B14;font-weight:900;display:inline-flex;align-items:center;gap:6px}
.wxrl .rl{font-size:1.6rem;line-height:1}
.wxb .wxpl{font-style:normal;font-weight:900;font-size:.95rem;color:var(--ink);background:rgba(255,255,255,.75);border-radius:999px;padding:0 8px;align-self:flex-start;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.wxmore{width:100%;margin-top:8px;background:#2D62C8;color:#fff;border-color:#2D62C8;font-weight:900}
/* 防災：トップの知らせ、警報の札、地震の行 */
.bosaibar{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;background:#D32F2F;border:2.5px solid #8E0000;border-radius:14px;padding:8px 12px;text-align:left;color:var(--ink)}
.bosaibar .em{font-size:1.5rem}
.bosaibar .t{display:flex;flex-direction:column;flex:1;min-width:0}
.bosaibar b{font-size:1.1rem;color:#fff}
.bosaibar .t span{font-size:.82rem;color:#FFECEC}
.bosaibar .go{color:#fff}
.bosaibar.sp{background:#2B0A3D;border-color:#9B30D0;color:#fff}.bosaibar.sp b{color:#FFD6FF}.bosaibar.sp .t span{color:#eee}
.bosaibar.eq{background:#FDE7E7;border-color:#C62828}.bosaibar.eq b{color:#B71C1C}.bosaibar.eq .t span{color:var(--sub)}.bosaibar.eq .go{color:var(--ink)}

  for(const r of TREE){
    const rid=r.name; NODES[rid]={id:rid,name:r.name,lv:'r',kids:[],parent:null};

    for(const b of r.blue){

/* ---------- 月のカレンダー ---------- */
function calGrid(ym,cat){
  const [y,m]=ym.split('-').map(Number); const first=new Date(y,m-1,1); const start=new Date(y,m-1,1-first.getDay());
  const weeks=Math.ceil((first.getDay()+new Date(y,m,0).getDate())/7);
  return calCells(start,weeks,cat,d=>d.getMonth()!==m-1?'out':'');
}
function calFromToday(cat){
  const n=new Date(); const start=new Date(n.getFullYear(),n.getMonth(),n.getDate()-n.getDay()); const t=today();
  return calCells(start,5,cat,d=>{const s=ymd(d); if(s<t) return 'past'; return d.getMonth()!==n.getMonth()?'nx':'';});
}
function topCal(){
  const mode=S.set.topCal||'from'; const t=today(); const ym=UI.topYm||'';
  const show=ym&&ym!==t.slice(0,7)?ym:'';
  const base=show||t.slice(0,7); const [y,m]=base.split('-').map(Number);
  const prev=ymd(new Date(y,m-2,1)).slice(0,7), next=ymd(new Date(y,m,1)).slice(0,7);
  const body=show?calGrid(show,''):(mode==='from'?calFromToday(''):calGrid(t.slice(0,7),''));
  return `<div class="sec t-cal"><h2>📅 カレンダー <button class="more" data-go="cal/${show||t.slice(0,7)}">大きく見る ›</button></h2>
  <div class="chips" style="padding-top:0"><button class="chip" aria-pressed="${!show&&mode==='from'}" data-act="topcal" data-c="from">今日から1か月</button><button class="chip" aria-pressed="${!show&&mode==='month'}" data-act="topcal" data-c="month">今月（${+t.slice(5,7)}月）</button></div>
  ${calNav(show?`${y}年${m}月`:(mode==='from'?'今日から1か月':`${y}年${m}月`),`data-act="topym" data-ym="${prev}"`,`data-act="topym" data-ym="${next}"`,show?`data-act="topym" data-ym=""`:'')}

function calCells(start,weeks,cat,cls){

  }
  return `<div class="cal">${[...WD].map((w,i)=>`<div class="wd ${i===0?'c-sun':i===6?'c-sat':''}">${w}</div>`).join('')}${cells}</div>`;
}

/* ---------- 予定を入れる ---------- */
function timeSel(name,val,id){
  const step=+S.set.minStep||15; const [vh,vm]=(val||'').split(':'); const hs=+S.set.hFrom, he=+S.set.hTo;
  const main=[],other=[]; for(let i=0;i<24;i++) (i>=hs&&i<=he?main:other).push(i);
  const opt=i=>`<option value="${pad(i)}" ${vh===pad(i)?'selected':''}>${i}時</option>`;
  const mins=[]; for(let m=0;m<60;m+=step) mins.push(m); if(vm&&!mins.includes(+vm)){mins.push(+vm);mins.sort((a,b)=>a-b);}
  return `<span class="tsel"><select id="${id}" name="${name}_h" aria-label="時"><option value="">--</option>${main.map(opt).join('')}${other.length?`<optgroup label="早朝・深夜">${other.map(opt).join('')}</optgroup>`:''}</select><select name="${name}_m" aria-label="分">${mins.map(m=>`<option value="${pad(m)}" ${vm===pad(m)?'selected':''}>${pad(m)}分</option>`).join('')}</select></span>`;
}

function genreChips(bigs,sel,q){
  q=(q||'').trim(); const seen=new Set();
  const bl=q?PLACE_BIG.filter(b=>Object.values(genresOf(b)).flat().some(g=>g.includes(q))):bigs;
  const chip=(g,b)=>{seen.add(g); return `<label><input type="checkbox" name="genre" value="${h(g)}" data-big="${h(b)}" ${sel.includes(g)?'checked':''}>${h(g)}</label>`;};
  let out=bl.map(b=>{
    const groups=Object.entries(genresOf(b)).map(([gn,gs])=>{const v=gs.filter(g=>!q||g.includes(q)&&!seen.has(g)); if(!v.length) return ''; return `${gn?`<div class="gsub">${h(gn)}</div>`:''}<div class="choose">${v.map(g=>chip(g,b)).join('')}</div>`;}).join('');
    return groups?`<div class="gbox"><div class="gbig">${BIG_EMOJI[b]||'📍'} ${h(b)}</div>${groups}</div>`:'';}).join('');
  const rest=sel.filter(g=>!seen.has(g));
  if(rest.length) out+=`<div class="gbox"><div class="gbig">選んでいるもの</div><div class="choose">${rest.map(g=>chip(g,'')).join('')}</div></div>`;
  if(!out) out=q?`<span class="small muted">「${h(q)}」は見つかりません。右の「足す」で新しく作れます。</span>`:'<span class="small muted">先に上の「大きなジャンル」を選ぶと、細かいジャンルが出ます。</span>';
  return out;
}

function worldRows(){ const now=new Date(); return WORLD.map(([n,z])=>{ let t='';try{t=new Intl.DateTimeFormat('ja-JP',{timeZone:z,month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'}).format(now);}catch(e){} return `<div class="row"><span class="t"><b>${n}</b></span><span style="font-weight:700;font-variant-numeric:tabular-nums">${t}</span></div>`;}).join(''); }
const fmtMS=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60);};
const swNow=()=>T.swAcc+(T.swRun?Date.now()-T.swStart:0);
const fmtSW=ms=>{const cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000);return (s>=3600?Math.floor(s/3600)+':':'')+pad(Math.floor(s/60)%60)+':'+pad(s%60)+'.'+pad(cs);};
function beep(){ try{ const A=window.AudioContext||window.webkitAudioContext; const a=new A(); [0,0.4,0.8].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.3,a.currentTime+t);o.start(a.currentTime+t);o.stop(a.currentTime+t+.25);}); }catch(e){} try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){} }
function calcEval(src){
  const toks=src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').match(/\d+\.?\d*|\.\d+|[-+*/()]/g)||[];
  let i=0; const peek=()=>toks[i], next=()=>toks[i++];
  function prim(){ const t=next(); if(t==='('){const v=expr(); next(); return v;} if(t==='-') return -prim(); const v=parseFloat(t); if(isNaN(v)) throw 0; return v; }
  function term(){ let v=prim(); while(peek()==='*'||peek()==='/'){ const o=next(); const r=prim(); v=o==='*'?v*r:v/r; } return v; }
  function expr(){ let v=term(); while(peek()==='+'||peek()==='-'){ const o=next(); const r=term(); v=o==='+'?v+r:v-r; } return v; }
  const v=expr(); if(i<toks.length||!isFinite(v)) throw 0; return Math.round(v*1e8)/1e8;
}

async function loadWx(force){
  const c=S.cache.wx; if(!force&&c&&c.lat===S.set.wx.lat&&c.lon===S.set.wx.lon&&Date.now()-c.at<30*60e3) return c.data;
  if(wxLoading) return null; wxLoading=true;
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${S.set.wx.lat}&longitude=${S.set.wx.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability,precipitation,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunset&minutely_15=precipitation&forecast_minutely_15=16&timezone=auto&forecast_days=7`;
    const r=await fetch(u); if(!r.ok) throw 0; const d=await r.json();
    S.cache.wx={at:Date.now(),lat:S.set.wx.lat,lon:S.set.wx.lon,data:d}; save(); return d;
  }catch(e){ S.cache.wxErr=Date.now(); return null; } finally{ wxLoading=false; }
}
function uvText(u){return u>=11?'極端に強い':u>=8?'非常に強い':u>=6?'強い':u>=3?'中くらい':'弱い';}
function heatText(t){return t>=35?'危険（運動は原則中止）':t>=31?'厳重警戒':t>=28?'警戒':t>=25?'注意':'';}
/* 洗濯物：これから3時間に雨が降りそうか（15分ごとの雨量＋1時間ごとの雨の確率） */
function rainSoon(d){
  if(!d||!d.current||!d.hourly) return null; const now=d.current.time.slice(0,16);
  if([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(d.current.weather_code)) return {now:true};
  const M=d.minutely_15;
  if(M&&M.time) for(let i=0;i<M.time.length;i++){ const t=M.time[i]; if(t<now) continue; if((M.precipitation[i]||0)>=0.1) return {at:t.slice(11,16).replace(/^0/,''),mm:M.precipitation[i]}; }
  const H=d.hourly; let st=H.time.findIndex(x=>x.slice(0,13)>=now.slice(0,13)); if(st<0) return null;
  for(let i=st;i<st+3&&i<H.time.length;i++){ const p=H.precipitation_probability[i]||0, mm=H.precipitation?H.precipitation[i]||0:0; if(p>=50||mm>=0.2) return {at:+H.time[i].slice(11,13)+'時',p}; }
  return null;
}
function laundryBar(){
  if(S.set.laundry===false) return ''; const w=S.cache.wx&&S.cache.wx.data; const nd=new Date(); const hr=nd.getHours();
  const r=hr>=6&&hr<20?rainSoon(w):null;
  if(r) return `<button class="laundry rain" data-go="weather/h"><span class="em">☔👕</span><span class="t"><b>雨危険、洗濯物取り込んで！</b><span>${r.now?'今、雨が降っています':`${h(r.at)}ごろから雨の予報${r.p!=null?`（${r.p}%）`:''}`}</span></span><span class="go">›</span></button>`;
  const ss=w&&w.daily&&w.daily.sunset&&w.daily.time[0]===today()?w.daily.sunset[0]:null;
  if(ss){ const [H,M]=ss.slice(11,16).split(':').map(Number); const m=hr*60+nd.getMinutes(), s=H*60+M;
    if(m>=s-30&&m<=s+90) return `<button class="laundry sun" data-go="weather"><span class="em">🌇👕</span><span class="t"><b>時間です、洗濯物取り込んで！</b><span>今日の日の入り ${H}:${String(M).padStart(2,'0')}（${h(S.set.wx.name)}）</span></span><span class="go">›</span></button>`; }
  return '';
}
function vWeather(mode){
  const c=S.cache.wx; const d=c&&c.lat===S.set.wx.lat&&c.lon===S.set.wx.lon?c.data:null;
  let body='';
  if(!d) body=`<div class="empty">${S.cache.wxErr&&!wxLoading?'天気を読み込めませんでした。電波のある所でもう一度開いてください。<br><span class="small">（この試作の見本画面では、天気が出ないことがあります）</span>':'天気を読み込んでいます…'}</div>`;
  else{
    const cu=d.current; const hrs=[]; const nowH=new Date().toISOString().slice(0,13);
    let st=d.hourly.time.findIndex(x=>x.slice(0,13)>=cu.time.slice(0,13)); if(st<0) st=0;
    for(let i=st;i<st+24&&i<d.hourly.time.length;i+=3) hrs.push(i);
    const ht=heatText(d.daily.temperature_2m_max[0]);
    const H=d.hourly; let hl='', lastDay='';
    for(let i=st;i<st+48&&i<H.time.length;i++){ const tt=H.time[i], dd=tt.slice(0,10);
      if(dd!==lastDay){ lastDay=dd; hl+=`<div class="hday">${dd===today()?'今日　':dd===ymd(new Date(Date.now()+864e5))?'明日　':''}${+dd.slice(5,7)}/${+dd.slice(8)}（${WD[parseD(dd).getDay()]}）</div>`; }
      const pp=H.precipitation_probability[i], pr=H.precipitation?H.precipitation[i]:null, ws=H.wind_speed_10m?H.wind_speed_10m[i]:null;
      hl+=`<div class="hrow ${i===st?'now':''}"><span class="hh">${i===st?'今':+tt.slice(11,13)+'時'}</span><span class="hi">${wxt(H.weather_code[i])[0]}</span><span class="hp ${pp>=50?'wet':''}"><b>☔${pp??'-'}%</b>${pr?`<small>${pr}mm</small>`:''}</span><span class="ht">${Math.round(H.temperature_2m[i])}℃</span><span class="hw">${h(wxt(H.weather_code[i])[1])}</span><span class="hv">${ws==null?'':'風'+Math.round(ws/3.6)}</span></div>`; }
    const M=d.minutely_15; let m15='';
    if(M&&M.time){ const now=cu.time.slice(0,16); const ix=M.time.map((t,i)=>i).filter(i=>M.time[i]>=now).slice(0,12);
      if(ix.length) m15=`<div class="sec"><h3>これから3時間の雨（15分ごと）</h3><div class="hours">${ix.map(i=>{const mm=M.precipitation[i]||0; return `<div class="${mm>=0.1?'wet15':''}"><div class="small">${M.time[i].slice(11,16).replace(/^0/,'')}</div><div style="font-size:1.3rem">${mm>=0.1?'☔':'－'}</div><b class="small">${mm>=0.1?mm+'mm':'なし'}</b></div>`;}).join('')}</div></div>`; }
    const hourSec=m15+`<div class="sec" id="wx-hours"><h3>さらに詳細な1時間ごとの天気（2日分）</h3><p class="small muted" style="margin:0 0 6px">☔は雨の降る確率（大きい字）、mmは1時間の雨の量、その次が気温、風は風の強さ（m/s）です。</p><div class="hlist">${hl}</div></div>`;
    body=`<div class="sec" style="display:flex;gap:14px;align-items:center"><span style="font-size:3.2rem">${wxt(cu.weather_code)[0]}</span><div><b style="font-size:2rem;font-family:var(--f-disp)">${Math.round(cu.temperature_2m)}℃</b> ${h(wxt(cu.weather_code)[1])}<div class="small muted">体感 ${Math.round(cu.apparent_temperature)}℃・湿度 ${cu.relative_humidity_2m}%・風 ${Math.round(cu.wind_speed_10m/3.6)}m/s</div></div></div>
    ${wxBosaiSec(d)}${mode==='h'?hourSec:''}<div class="sec"><h3>3時間ごと</h3><div class="hours">${hrs.map(i=>`<div><div class="small">${+d.hourly.time[i].slice(11,13)}時</div><div style="font-size:1.4rem">${wxt(d.hourly.weather_code[i])[0]}</div><b>${Math.round(d.hourly.temperature_2m[i])}℃</b><div class="small muted">☔${d.hourly.precipitation_probability[i]??'-'}%</div></div>`).join('')}</div></div>
    <div class="sec"><h3>今日の目安</h3><dl class="kv">${d.daily.sunset?`<dt>日の入り</dt><dd>${+d.daily.sunset[0].slice(11,13)}:${d.daily.sunset[0].slice(14,16)}</dd>`:''}<dt>紫外線</dt><dd>${uvText(d.daily.uv_index_max[0])}（${Math.round(d.daily.uv_index_max[0])}）</dd>${ht?`<dt>熱中症</dt><dd>${ht}</dd>`:''}<dt>花粉</dt><dd class="muted small">準備中</dd></dl></div>
    <div class="sec"><h3>1週間</h3>${d.daily.time.map((t,i)=>`<div class="wxday"><span class="${dayClass(t)}" style="font-weight:700">${+t.slice(5,7)}/${+t.slice(8)}（${WD[parseD(t).getDay()]}）</span><span style="font-size:1.3rem">${wxt(d.daily.weather_code[i])[0]}</span><span>${h(wxt(d.daily.weather_code[i])[1])} <span class="small muted">☔${d.daily.precipitation_probability_max[i]??'-'}%</span></span><span style="font-variant-numeric:tabular-nums"><b style="color:var(--sun)">${Math.round(d.daily.temperature_2m_max[i])}</b> / <b style="color:var(--sat)">${Math.round(d.daily.temperature_2m_min[i])}</b></span></div>`).join('')}</div>
    ${mode==='h'?'':hourSec}<p class="small muted">天気のデータ：Open-Meteo（無料）</p>`;
  }
  return sub('天気',`<div class="f"><label for="wx-city">場所：${h(S.set.wx.name)}</label><select id="wx-city">${CITIES.map(([n])=>`<option ${S.set.wx.name===n?'selected':''}>${n}</option>`).join('')}${CITIES.some(c=>c[0]===S.set.wx.name)?'':`<option selected>${h(S.set.wx.name)}</option>`}</select></div>
  <div class="btns"><button class="btn plain" data-act="wxhere">📍 今いる場所にする</button><button class="btn wxrl" data-act="wxreload">最新情報に更新 <span class="rl" aria-hidden="true">🔄</span></button></div>${body}`,{crumb:'NEWS・知識 › NEWS'});
}

function vSearch(q){
  q=(q||'').trim(); let res='';
  if(q){
    const nodes=Object.values(NODES).filter(n=>!isOff(n.id)&&(n.name.includes(q)||(n.items||[]).some(x=>x[0].includes(q)))).slice(0,30);
    const ppl=S.people.filter(p=>[p.name,p.kana,(p.log||[]).map(x=>x.text).join(' ')].join(' ').includes(q));
    const pls=S.places.filter(p=>plText(p).includes(q));
    const evs=S.events.filter(e=>(e.title+' '+(e.memo||'')).includes(q)).slice(0,20);
    const mms=allMemos().filter(m=>m.text.includes(q)).slice(0,20);
    const sec=(t,arr,f)=>arr.length?`<div class="sec"><h3>${t}（${arr.length}）</h3><div class="list">${arr.map(f).join('')}</div></div>`:'';
    res=sec('機能',nodes,n=>`<button class="row" data-act="open" data-id="${h(n.id)}"><span class="em">${emojiOf(n.id)}</span><span class="t"><b>${h(n.name)}</b><span>${crumbOf(n.id)}</span></span>${hasImpl(n.id)?'<span class="badge ok">使える</span>':'<span class="badge wait">準備中</span>'}</button>`)
      +sec('人',ppl,p=>`<button class="row" data-go="person/${p.id}">${face(p,40)}<span class="t"><b>${h(p.name)}</b></span></button>`)
      +sec('場所',pls,placeRow)
      +sec('予定',evs,e=>`<button class="row" data-go="ev/${e.id}"><span class="t"><b>${h(e.title)}</b><span>${jpDate(e.date)}</span></span></button>`)
      +sec('メモ',mms,m=>`<button class="row" ${m.go?`data-go="${m.go}"`:'data-go="memo"'}><span class="t"><b>${h(m.text.slice(0,40))}</b><span>${h(m.src)} ${h(m.sub)}</span></span></button>`);
    if(!res) res='<div class="empty">見つかりませんでした。ほかの言葉でも探してみてください。</div>';
  }
  return sub('探す',`<form data-form="search"><input class="search" id="sq" name="q" type="search" value="${h(q)}" placeholder="「〇〇したい」「歯医者」「誕生日」など" autofocus></form>

}

const SLOTS=[['b','朝'],['l','昼'],['d','夕'],['s','寝る前']];
const TIMINGS=[['before','食前',-30,'食事の30分前'],['just','食直前',-5,'食事のすぐ前'],['right','食直後',5,'食事のすぐ後'],['after','食後',30,'食事の30分後'],['between','食間',120,'食事の2時間後'],['none','食事に関係なく',0,'食事の時刻']];
const SLOTNAME=Object.fromEntries(SLOTS); const TIMING=Object.fromEntries(TIMINGS.map(t=>[t[0],t]));
const UNITS=['錠','包','カプセル','mL','滴','枚','回','本'];
function mealTime(slot){ const m=S.set.meal||{b:'07:00',l:'12:00',d:'18:00',s:'22:00'}; return m[slot]; }
const addMin=(hm,n)=>{const [h,m]=hm.split(':').map(Number);let t=Math.max(0,Math.min(23*60+59,h*60+m+n));return pad(Math.floor(t/60))+':'+pad(t%60);};
function slotTime(med,slot){ if(slot==='s') return addMin(mealTime('s'),-30); return addMin(mealTime(slot),TIMING[med.timing||'after'][2]); }
function medActiveOn(med,s){
  if(med.freq==='prn') return false;
  if(med.start&&s<med.start) return false; if(med.end&&s>med.end) return false;
  if(med.freq==='weekly') return (med.days||[]).includes(parseD(s).getDay());
  if(med.freq==='every'){ const st=med.start||S.set.started||s; const n=Math.max(2,+med.every||2); const diff=dnum(s)-dnum(st); return diff>=0&&diff%n===0; }
  return true;
}
function dosesOn(s){
  const out=[];
  for(const m of S.meds||[]){ if(!medActiveOn(m,s)) continue;
    for(const sl of m.slots||[]) out.push({med:m,key:m.id+'|'+sl,label:SLOTNAME[sl],time:slotTime(m,sl),how:sl==='s'?'寝る前':TIMING[m.timing||'after'][1]});
    for(const t of m.times||[]) if(t) out.push({med:m,key:m.id+'|t'+t,label:'',time:t,how:'時刻を決めて'});
  }
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
const taken=(s,key)=>((S.medlog||{})[s]||{})[key];
function medFreqText(m){
  if(m.freq==='prn') return '頓服（必要なときだけ）';
  if(m.freq==='weekly') return (m.days&&m.days.length===1?'週1回 ':'')+(m.days||[]).map(d=>WD[d]).join('・')+'曜日';
  if(m.freq==='every') return (+m.every||2)===2?'1日おき':`${+m.every}日ごと`;
  return '毎日';
}
function medSchedText(m){
  if(m.freq==='prn') return '頓服（必要なときだけ）';
  const parts=(m.slots||[]).map(sl=>SLOTNAME[sl]); const t=(m.times||[]).filter(Boolean);
  return `${medFreqText(m)}・${parts.join('・')}${parts.length&&!(parts.length===1&&m.slots[0]==='s')?'　'+TIMING[m.timing||'after'][1]:''}${t.length?(parts.length?'・':'')+t.join('、'):''}`;
}
function lowStock(m){ return m.left!==''&&m.left!=null&&+m.left<=(+m.low||0)&&+m.low>0; }
function doseBtn(d,s){ const tk=taken(s,d.key);

/* ===== 防災（警報・注意報、地震、台風）と天気の解説 =====
   使うのは無料の公的な情報だけ：気象庁のJSON（警報・天気概況・台風）、P2P地震情報（地震）、国土地理院（場所→市町村コード） */
const JMA_OFFICE={'01':'016000','02':'020000','03':'030000','04':'040000','05':'050000','06':'060000','07':'070000','08':'080000','09':'090000','10':'100000','11':'110000','12':'120000','13':'130000','14':'140000','15':'150000','16':'160000','17':'170000','18':'180000','19':'190000','20':'200000','21':'210000','22':'220000','23':'230000','24':'240000','25':'250000','26':'260000','27':'270000','28':'280000','29':'290000','30':'300000','31':'310000','32':'320000','33':'330000','34':'340000','35':'350000','36':'360000','37':'370000','38':'380000','39':'390000','40':'400000','41':'410000','42':'420000','43':'430000','44':'440000','45':'450000','46':'460100','47':'471000'};
const WARN_NAME={'02':'暴風雪警報','03':'大雨警報','04':'洪水警報','05':'暴風警報','06':'大雪警報','07':'波浪警報','08':'高潮警報',
 '10':'大雨注意報','12':'大雪注意報','13':'風雪注意報','14':'雷注意報','15':'強風注意報','16':'波浪注意報','17':'融雪注意報','18':'洪水注意報','19':'高潮注意報','20':'濃霧注意報','21':'乾燥注意報','22':'なだれ注意報','23':'低温注意報','24':'霜注意報','25':'着氷注意報','26':'着雪注意報',
 '32':'暴風雪特別警報','33':'大雨特別警報','35':'暴風特別警報','36':'大雪特別警報','37':'波浪特別警報','38':'高潮特別警報'};
const warnLevel=c=>(+c>=32?3:+c<10?2:1); // 3特別警報 2警報 1注意報
const SCALE={10:'1',20:'2',30:'3',40:'4',45:'5弱',50:'5強',55:'6弱',60:'6強',70:'7'};
let bosaiLoading=false;
async function getJSON(u){ const r=await fetch(u,{cache:'no-cache'}); if(!r.ok) throw new Error(r.status); return r.json(); }
/* 天気の場所 → 市町村コード（国土地理院） */
async function bosaiMuni(){
  const w=S.set.wx, c=S.cache.muni;
  if(c&&c.lat===w.lat&&c.lon===w.lon) return c.code;
  const d=await getJSON(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${w.lat}&lon=${w.lon}`);
  const code=d&&d.results&&d.results.muniCd; if(!code) throw new Error('muni');
  S.cache.muni={lat:w.lat,lon:w.lon,code:String(code).padStart(5,'0')}; return S.cache.muni.code;
}
async function loadBosai(force){
  const b=S.cache.bosai; const w=S.set.wx;
  if(!force&&b&&b.lat===w.lat&&b.lon===w.lon&&Date.now()-b.at<10*60e3) return b;
  if(bosaiLoading) return null; bosaiLoading=true;
  const out={at:Date.now(),lat:w.lat,lon:w.lon,warn:null,quake:null,tc:null,ov:null,err:{}};
  try{
    let muni=''; try{ muni=await bosaiMuni(); }catch(e){ out.err.muni=1; }
    out.muni=muni; const pc=muni.slice(0,2); out.pref=pc?PREFS[+pc-1]:''; const off=JMA_OFFICE[pc];
    const jobs=[];
    if(off){
      jobs.push(getJSON(`https://www.jma.go.jp/bosai/warning/data/warning/${off}.json`).then(d=>{
        const cand=[muni+'00',muni.slice(0,4)+'000']; let area=null;
        for(const at of d.areaTypes||[]) for(const a of at.areas||[]) if(cand.includes(a.code)) area=a;
        const list=area?(area.warnings||[]).filter(x=>x.code&&WARN_NAME[x.code]&&x.status!=='解除'&&!/なし/.test(x.status||'')).map(x=>({code:x.code,name:WARN_NAME[x.code],lv:warnLevel(x.code),status:x.status})):[];
        list.sort((a,b)=>b.lv-a.lv);
        out.warn={time:d.reportDatetime,head:d.headlineText||'',list,found:!!area,office:off,area:area?area.code:''};
      }).catch(()=>{out.err.warn=1;}));
      jobs.push(getJSON(`https://www.jma.go.jp/bosai/forecast/data/overview_forecast/${off}.json`).then(d=>{ out.ov={time:d.reportDatetime,office:d.publishingOffice,head:d.headlineText||'',text:d.text||''}; }).catch(()=>{out.err.ov=1;}));
    }
    jobs.push(getJSON('https://api.p2pquake.net/v2/history?codes=551&limit=20').then(d=>{
      out.quake=(d||[]).filter(x=>x.earthquake&&x.earthquake.hypocenter&&x.earthquake.hypocenter.name).slice(0,10).map(x=>{const e=x.earthquake; const mine=(x.points||[]).filter(p=>p.pref===out.pref).reduce((m,p)=>Math.max(m,p.scale||0),0);
        return {time:e.time,name:e.hypocenter.name,mag:e.hypocenter.magnitude,depth:e.hypocenter.depth,max:e.maxScale,mine,tsunami:e.domesticTsunami};});
    }).catch(()=>{out.err.quake=1;}));
    jobs.push(getJSON('https://www.jma.go.jp/bosai/typhoon/data/targetTc.json').then(d=>{ out.tc=Array.isArray(d)?d:[]; }).catch(()=>{out.err.tc=1;}));
    await Promise.all(jobs);
    S.cache.bosai=out; save(); return out;
  }finally{ bosaiLoading=false; }
}
function bosaiNow(){ const b=S.cache.bosai, w=S.set.wx; return b&&b.lat===w.lat&&b.lon===w.lon?b:null; }
const quakeAge=q=>{ const t=Date.parse((q.time||'').replace(/\//g,'-').replace(' ','T')+'+09:00'); return isNaN(t)?1e12:Date.now()-t; };
/* トップに出す知らせ（警報・大きな地震） */
function bosaiBar(){
  const b=bosaiNow(); if(!b) return ''; let out='';
  const big=b.warn&&b.warn.list.filter(x=>x.lv>=2);
  if(big&&big.length){ const sp=big.some(x=>x.lv===3);
    out+=`<button class="bosaibar ${sp?'sp':''}" data-go="bosai"><span class="em">${sp?'🚨':'⚠️'}</span><span class="t"><b>${h(big.map(x=>x.name).join('・'))}</b><span>${h(S.set.wx.name)}に出ています。避難の情報も確かめてください</span></span><span class="go">›</span></button>`; }
  const q=(b.quake||[]).find(q=>quakeAge(q)<3*3600e3&&(q.max>=40||q.mine>=30));
  if(q) out+=`<button class="bosaibar eq" data-go="bosai"><span class="em">🌏</span><span class="t"><b>地震 最大震度${SCALE[q.max]||'-'}${q.mine?`（${h(b.pref)} 震度${SCALE[q.mine]||'-'}）`:''}</b><span>${h(q.time.slice(5,16))}　震源：${h(q.name)}</span></span><span class="go">›</span></button>`;
  return out;
}
/* 天気画面に出す：解説と警報の要約 */
function wxComment(d){
  if(!d||!d.daily) return '';
  const H=d.hourly, now=d.current.time.slice(0,13); let st=H.time.findIndex(x=>x.slice(0,13)>=now); if(st<0) st=0;
  const day=d.daily, i0=0; const hi=Math.round(day.temperature_2m_max[i0]), lo=Math.round(day.temperature_2m_min[i0]);
  const s=[]; s.push(`今日は${wxt(day.weather_code[i0])[1]||'おおむね穏やか'}。最高${hi}℃、最低${lo}℃。`);
  let rainAt=-1; for(let i=st;i<st+12&&i<H.time.length;i++){ if((H.precipitation_probability[i]||0)>=50){rainAt=i;break;} }
  if(rainAt>=0) s.push(`${+H.time[rainAt].slice(11,13)}時ごろから雨の確率が${H.precipitation_probability[rainAt]}%に上がります。傘を持って出かけると安心です。`);
  else if((day.precipitation_probability_max[i0]||0)<20) s.push('雨の心配はほとんどありません。');
  const diff=hi-lo; if(diff>=10) s.push(`朝と昼の気温の差が${diff}℃あります。脱ぎ着しやすい服がおすすめです。`);
  if(day.temperature_2m_max[1]!=null){ const t=Math.round(day.temperature_2m_max[1])-hi; if(t<=-4) s.push(`明日は今日より${-t}℃ほど寒くなりそうです。`); else if(t>=4) s.push(`明日は今日より${t}℃ほど暖かくなりそうです。`); }
  if(hi>=31) s.push('暑さが厳しいので、水分をこまめにとってください。'); if(lo<=0) s.push('朝は氷点下。道路の凍結に気をつけて。');
  return s.join('');
}
function wxBosaiSec(d){
  const b=bosaiNow(); const ov=b&&b.ov; const cm=wxComment(d);

}

function vGuide(){
  const q=(UI.gQ||'').trim();
  const secs=GUIDE.map(([em,t,items])=>{ const it=items.filter(([a,b])=>!q||(t+a+b).includes(q)); if(!it.length) return '';
    return `<div class="sec gd"><h3>${em} ${h(t)}</h3>${it.map(([a,b])=>`<details ${q?'open':''}><summary>${h(a)}</summary><p>${h(b)}</p></details>`).join('')}</div>`; }).join('');
  return sub('使い方の説明',`<div class="gdcatch">ライフサポート万能アプリ<b>「BOOTIN」</b>の使い方</div><p class="small muted" style="margin:0 0 6px">知りたい項目を押すと説明が開きます。言葉で探すこともできます。</p>
  <input class="search" id="gq" type="search" placeholder="🔍 例：洗濯物、祝日、場所" value="${h(UI.gQ||'')}">
  <div id="glist">${secs||'<div class="empty">見つかりませんでした</div>'}</div>`,{crumb:'設定・機能'});
}

function routeView(r){
  const [a,...rest]=r.split('/'); const arg=decodeURIComponent(rest.join('/'));
  switch(a){
    case 'home': return vHome();
    case 'day': return vDay(arg);
    case 'cal': return vCal(arg);
    case 'ev': return vEvent(arg);
    case 'evnew': return vEvent('',arg);
    case 'node': return vNode(arg);
    case 'people': return vPeople();
    case 'person': return vPerson(arg);
    case 'pedit': return vPEdit(arg);
    case 'pcats': return vPCats();
    case 'places': return vPlaces();
    case 'shops': return vShops();
    case 'place': return vPlace(arg);
    case 'pledit': return vPlEdit(arg);
    case 'memo': return vMemo();
    case 'tools': return vTools();
    case 'weather': return vWeather(arg);
    case 'bosai': return vBosai();
    case 'guide': return vGuide();
    case 'gomi': return vGomi();
    case 'otayori': return vOtayori();
    case 'search': return vSearch(arg);
    case 'settings': return vSettings();
    case 'features': return vFeatures();
    case 'gridpick': return vGridPick(arg);
    case 'otasukeset': return vOtasukeSet();
    case 'me': return vMe();
    case 'data': return vData();
    case 'install': return vInstall();
    case 'meds': return vMeds();
    case 'medit': return vMedEdit(arg);
  }
  return vHome();
}

  const it=(go,em,t,act)=>`<button class="sn ${act?'on':''}" ${go.startsWith('@')?`data-act="${go.slice(1)}"`:`data-go="${go}"`}><span>${em}</span>${h(t)}</button>`;
  return `<aside class="side"><button class="brand" data-act="opening" aria-label="BOOTIN（オープニングを見る）"><img src="${BOO_F}" alt="">BOOTIN</button>
  ${r==='home'?it('home','🏠','トップ',true):`<button class="sn topsn" data-go="home"><span class="topbtn">TOPへ</span></button>`}${it('cal/'+today().slice(0,7),'📅','カレンダー',r.startsWith('cal'))}${it('day/'+today(),'🗓️','今日の1日カード',r.startsWith('day'))}

function render(){
  const root=document.documentElement;
  root.classList.toggle('f2',S.set.font==2); root.classList.toggle('f3',S.set.font==3||(S.set.mode==='elder'&&S.set.font==1));
  if(S.set.theme) root.setAttribute('data-theme',S.set.theme); else root.removeAttribute('data-theme');
  root.setAttribute('data-gline',S.set.gline||'r'); root.setAttribute('data-kise',(S.set.kise==='kisetsu')?['yuki','yuki','haru','haru','haru','natsu','natsu','natsu','momiji','momiji','momiji','yuki'][new Date().getMonth()]:(S.set.kise||'bee'));
  const r=cur();
  if(r==='home'&&!IN_FRAME) {}
  $('#app').innerHTML=`<div class="shell">${sideNav()}<main class="wrap ${r==='home'?'home':''}">${routeView(r)}</main></div><nav class="tabbar" aria-label="移動">${r==='home'?'':`<button data-act="back"><span>←</span>もどる</button>`}${[['home','','TOPへ'],['@menu','','MENU'],['day/'+today(),'🗓️','1日カード'],['cal/'+today().slice(0,7),'📅','カレンダー'],['memo','✏️','メモ一覧']].map(([g,e,t])=>(g==='@menu'?`<button class="tb-menu" data-act="menu" aria-label="MENU（9つの入口）"><span class="mn">▦</span>MENU</button>`:g==='home'?`<button class="tb-top" data-go="home" aria-label="トップ画面へ" ${r==='home'?'aria-current="page"':''}><span class="topbtn">TOPへ</span></button>`:`<button data-go="${g}" ${r.split('/')[0]===g.split('/')[0]?'aria-current="page"':''}><span>${e}</span>${t}</button>`)).join('')}</nav><button class="fab" data-act="qmemo" aria-label="さっとメモ">✏️ メモ</button>`;
  after(r);
}

  if((r==='home'||r.startsWith('weather')||r==='bosai')&&!bosaiLoading){ const b=S.cache.bosai; if(!(b&&b.lat===S.set.wx.lat&&b.lon===S.set.wx.lon&&Date.now()-b.at<10*60e3)&&!(S.cache.bosaiErr&&Date.now()-S.cache.bosaiErr<60e3)){ loadBosai().then(d=>{ if(!d) S.cache.bosaiErr=Date.now(); if(cur()===r) render(); }).catch(()=>{ S.cache.bosaiErr=Date.now(); if(cur()===r) render(); }); } }
  if(r==='home'||r.startsWith('weather')){ const c=S.cache.wx; if(!(c&&c.lat===S.set.wx.lat&&c.lon===S.set.wx.lon&&Date.now()-c.at<30*60e3)&&!(S.cache.wxErr&&Date.now()-S.cache.wxErr<60e3)){ if(!wxLoading) loadWx().then(d=>{ if((d||S.cache.wxErr)&&cur()===r) render(); }); } }
  const dm=$('#daymemo'); if(dm){ let tm; dm.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{const s=cur().split('/')[1]; S.daymemo[s]=dm.value; if(!dm.value.trim()) delete S.daymemo[s]; save();},400);}); }
  const pq=$('#pq'); if(pq) pq.addEventListener('input',()=>{UI.pQ=pq.value;$('#plist').innerHTML=peopleList();});
  const plq=$('#plq'); if(plq) plq.addEventListener('input',()=>{UI.plQ=plq.value;$('#pllist').innerHTML=placeList();});
  const tmo=$('#ev-tmode'); if(tmo) tmo.addEventListener('change',()=>{ const v=$('#ev-tmode input:checked').value; $('#ev-times').hidden=v!=='set'; });
  const pla=$('#plarea'); if(pla) pla.addEventListener('change',()=>{UI.plArea=pla.value; UI.plNear=null; render();});
  const pad_=$('#pl-addr'); if(pad_) pad_.addEventListener('input',()=>{ const pr=prefOf(pad_.value), ct=cityOf(pad_.value); if(pr) $('#pl-pref').value=pr; if(ct) $('#pl-city').value=ct; $('[name=lat]').value=''; $('[name=lon]').value=''; $('#pl-pos').textContent='住所を入れると、登録するときに位置を自動で調べます'; });
  const gmm=$('#gm-mode'); if(gmm) gmm.addEventListener('change',()=>{ $('#gm-nth').hidden=$('#gm-mode input:checked').value!=='nth'; });
  const gq=$('#gq'); if(gq) gq.addEventListener('input',()=>{UI.gQ=gq.value; const tmp=document.createElement('div'); tmp.innerHTML=vGuide(); const n=tmp.querySelector('#glist'); if(n) $('#glist').innerHTML=n.innerHTML;});
  const mq=$('#mq'); if(mq) mq.addEventListener('input',()=>{UI.memoQ=mq.value;$('#mlist').innerHTML=memoList();});
  const sq=$('#sq'); if(sq&&!sq.value) try{sq.focus();}catch(e){}
  const wc=$('#wx-city'); if(wc) wc.addEventListener('change',()=>{const c=CITIES.find(x=>x[0]===wc.value); if(c){S.set.wx={name:c[0],lat:c[1],lon:c[2]}; S.cache.wxErr=0; save(); render(); loadWx(true).then(()=>render());}});
  const pf=$('#ph-file'); if(pf) pf.addEventListener('change',async()=>{const f=pf.files[0]; if(!f) return; try{const d=await readPhoto(f,320); $('#ph-data').value=d; $('#ph-prev').innerHTML=face({photo:d},72);}catch(e){toast('写真を読み込めませんでした');}});
  const big=$('#pl-big'); if(big){
    const regen=()=>{const bigs=$$('#pl-big input:checked').map(x=>x.value); const sel=[...new Set($$('#pl-genre input:checked').map(x=>x.value))]; $('#pl-genre').innerHTML=genreChips(bigs,sel,$('#pl-newg').value);};
    big.addEventListener('change',regen); $('#pl-newg').addEventListener('input',regen);
    $('#pl-newg').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); ACTS.addgenre(); } });
    $('#pl-genre').addEventListener('change',e=>{ const t=e.target; if(t.checked&&t.dataset.big){ const b=$(`#pl-big input[value="${t.dataset.big}"]`); if(b&&!b.checked) b.checked=true; } });
  }
  const imf=$('#imp-file'); if(imf) imf.addEventListener('change',()=>{const f=imf.files[0]; if(!f) return; const fr=new FileReader(); fr.onload=()=>doImport(fr.result); fr.readAsText(f);});
  medAfter();
  $$('details.tree[data-red]').forEach(d=>d.addEventListener('toggle',()=>{d.open?UI.openReds.add(d.dataset.red):UI.openReds.delete(d.dataset.red);}));
}

/* 時計 */
function tick(){
  const now=new Date(); const hm=pad(now.getHours())+':'+pad(now.getMinutes());
  const a=$('#clockT'); if(a) a.textContent=hm;
  const b=$('#bigT'); if(b) b.textContent=hm+':'+pad(now.getSeconds());
  const w=$('#world'); if(w&&now.getSeconds()===0) w.innerHTML=worldRows();
  const tm=$('#tmT'); if(tm&&T.timerRun) tm.textContent=fmtMS(T.timerEnd-Date.now());
  if(now.getSeconds()<1) medCheck();
  if(T.timerRun&&Date.now()>=T.timerEnd){ T.timerRun=false; T.timerLeft=0; beep(); toast('⏲️ 時間です！'); if(cur()==='tools') render(); }
  const sw=$('#swT'); if(sw&&T.swRun) sw.textContent=fmtSW(swNow());
  if($('#clockD')&&$('#clockD').textContent!==jpDate(today())&&cur()==='home') render();
}
setInterval(tick,250);

/* 左右に指でスライドして月を変える */
let swX=0,swY=0,swT=null;
document.addEventListener('touchstart',ev=>{const t=ev.target.closest('[data-swipe]'); swT=t; if(!t) return; swX=ev.touches[0].clientX; swY=ev.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',ev=>{ if(!swT) return; const t=swT; swT=null;
  const dx=ev.changedTouches[0].clientX-swX, dy=ev.changedTouches[0].clientY-swY;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5) return;
  const ym=dx<0?t.dataset.next:t.dataset.prev;
  swipeBlock=Date.now();
  if(t.dataset.swipe==='big') go('cal/'+ym,true); else { UI.topYm=ym; render(); }
},{passive:true});
let swipeBlock=0;

/* 押したとき */
document.addEventListener('click',async ev=>{
  if(Date.now()-swipeBlock<400){ ev.preventDefault(); return; }
  const g=ev.target.closest('[data-go],[data-go-r]');
  if(g&&!ev.target.closest('a')){ ev.preventDefault(); if(g.dataset.goR) go(g.dataset.goR,true); else go(g.dataset.go); return; }
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const A=el.dataset.act; const d=el.dataset;
  if(A==='none') { ev.stopPropagation(); return; }
  if(el.tagName==='BUTTON'||el.getAttribute('role')==='button') ev.preventDefault();
  const fn=ACTS[A]; if(fn) await fn(el,d,ev);
});
document.addEventListener('keydown',ev=>{ if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[role=button][data-act]')){ev.preventDefault();ev.target.click();} if(ev.key==='Escape'){const s=$('.sheet-bg'); if(s) s.remove();} });
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.dataset.act==='setr'){ const v=isNaN(+el.value)||el.value===''?el.value:+el.value; S.set[el.name]=v; save(); render(); }
  if(el.dataset.act==='sethr'){ S.set[el.dataset.k]=+el.value; if(+S.set.hFrom>+S.set.hTo){const a=S.set.hFrom;S.set.hFrom=S.set.hTo;S.set.hTo=a;} save(); render(); }
  if(el.dataset.act==='setarea'){ S.set.area=S.set.area||{pref:'',city:''}; S.set.area[el.dataset.k]=el.value.trim(); save(); }
  if(el.dataset.act==='setcn'){ S.set.cn=el.checked; save(); }
  if(el.dataset.act==='setlaundry'){ S.set.laundry=el.checked; save(); }
  if(el.dataset.act==='feat'){ const id=el.dataset.id; if(el.checked) delete S.set.off[id]; else S.set.off[id]=true; save(); }
});
document.addEventListener('submit',async ev=>{
  const f=ev.target.closest('form[data-form]'); if(!f) return; ev.preventDefault();
  const fn=FORMS[f.dataset.form]; if(fn) await fn(f,new FormData(f));
});

}
function gomiRule(g){
  const ds=(g.days||[]).slice().sort().map(i=>WD[i]).join('・');
  return g.mode==='nth'?`第${(g.nth||[]).slice().sort().join('・第')} ${ds}曜日`:`毎週 ${ds}曜日`;
}
/* トップと1日のカードに出す札 */
function gomiTag(s){
  const td=gomiOn(s); const hr=new Date().getHours(); const isToday=s===today();
  const tm=isToday&&hr>=15?gomiOn(addDays(s,1)):[];
  if(!td.length&&!tm.length) return '';
  return `<button class="gomitag" data-go="gomi">${td.length?`<span><b>🗑️ ${isToday?'今日':'この日'}のゴミ</b> ${td.map(g=>`${g.em||''}${h(g.name)}`).join('・')}</span>`:''}${tm.length?`<span class="tm"><b>明日のゴミ</b> ${tm.map(g=>`${g.em||''}${h(g.name)}`).join('・')}</span>`:''}</button>`;
}
function vGomi(){
  const list=(S.gomi||[]);
  const wk=[0,1,2,3,4,5,6].map(i=>`<label><input type="checkbox" name="days" value="${i}">${WD[i]}</label>`).join('');
  const nt=[1,2,3,4,5].map(i=>`<label><input type="checkbox" name="nth" value="${i}">第${i}</label>`).join('');
  // これから1週間
  const t=today(); let week='';
  for(let i=0;i<7;i++){ const s=addDays(t,i); const g=gomiOn(s); week+=`<div class="gwrow ${i===0?'now':''}"><span class="${dayClass(s)}">${i===0?'今日':i===1?'明日':`${+s.slice(5,7)}/${+s.slice(8)}`}（${WD[parseD(s).getDay()]}）</span><span>${g.length?g.map(x=>`${x.em||''}${h(x.name)}`).join('・'):'<span class="muted">なし</span>'}</span></div>`; }
  return sub('ゴミ出しの日',`
  ${list.length?`<div class="sec"><h3>これから1週間</h3>${week}</div>`:''}
  <div class="sec"><h3>登録したゴミ</h3>${list.length?list.map(g=>`<div class="gomirow"><span class="em">${g.em||'🗑️'}</span><span class="t"><b>${h(g.name)}</b><span>${gomiRule(g)}</span></span><button class="mini" data-act="gomidel" data-id="${g.id}">削除</button></div>`).join(''):'<p class="muted" style="margin:0">まだありません。下から登録してください。</p>'}</div>
  <form class="sec" data-form="gomi"><h3>ゴミの日を登録する</h3>
    <div class="f"><span class="lb">ゴミの種類（押すと入ります）</span><div class="chips">${GOMI_PRESET.map(([e,n])=>`<button type="button" class="chip" data-act="gomipick" data-e="${e}" data-n="${n}">${e} ${n}</button>`).join('')}</div>
      <div style="display:flex;gap:6px;margin-top:6px"><input name="em" id="gm-em" value="🗑️" style="width:3.2em;text-align:center" aria-label="印"><input name="name" id="gm-name" required placeholder="例：燃えるゴミ" style="flex:1;min-width:0"></div></div>
    <div class="f"><span class="lb">いつ出す？</span><div class="choose" id="gm-mode"><label><input type="radio" name="mode" value="week" checked>毎週</label><label><input type="radio" name="mode" value="nth">第○週だけ（例：第1・第3）</label></div></div>
    <div class="f" id="gm-nth" hidden><span class="lb">何週目？</span><div class="choose">${nt}</div></div>
    <div class="f"><span class="lb">曜日（いくつでも）</span><div class="choose">${wk}</div></div>
    <button class="btn" type="submit">登録する</button>
  </form>
  <p class="small muted">登録したゴミの日は、トップの「今日の予定」と1日のカードに出ます。午後3時を過ぎると、明日のゴミも出ます。</p>`,{crumb:'生活管理 › 日常管理'});
}
Object.assign(ACTS,{
  gomipick:el=>{ const m=$('#gm-em'); if(!m) return; m.value=el.dataset.e; $('#gm-name').value=el.dataset.n; },
  gomidel:el=>{ if(el.dataset.sure!=='1'){ el.dataset.sure='1'; el.textContent='もう一度押すと削除'; return; } S.gomi=(S.gomi||[]).filter(g=>g.id!==el.dataset.id); save(); render(); }
});
FORMS.gomi=(f,fd)=>{
  const days=fd.getAll('days').map(Number), nth=fd.getAll('nth').map(Number), mode=fd.get('mode');
  if(!days.length){ toast('曜日を選んでください'); return; }
  if(mode==='nth'&&!nth.length){ toast('何週目かを選んでください'); return; }
  S.gomi=S.gomi||[]; S.gomi.push({id:'g'+Date.now().toString(36),name:(fd.get('name')||'').trim()||'ゴミ',em:(fd.get('em')||'').trim(),mode,days,nth:mode==='nth'?nth:[]});
  save(); toast('登録しました'); render();
};

</script>
